name: cell-death
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11

  # ---------- core scientific stack ----------
  - numpy
  - pandas
  - scipy
  - scikit-image
  - matplotlib
  - seaborn
  - tifffile
  - imageio

  # ---------- napari + GUI ----------
  - napari
  - napari-svg
  - magicgui
  - qtpy
  - pyqt
  - vispy
  - superqt
  - pyopengl

  # ---------- ImageJ / TrackMate ----------
  - pyimagej
  - scyjava
  - imglyb
  - jpype1
  - openjdk=11
  - maven
  - napari-imagej

  # ---------- pytorch (CUDA 12.4) ----------
  - pytorch
  - torchvision
  - pytorch-cuda=12.4

  # ---------- notebook / dev ----------
  - ipykernel
  - pip

  - pip:
      - cellpose
